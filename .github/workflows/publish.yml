name: Publish Shorts
on:
  schedule:
    - cron: '41 * * * *'    # hourly; posts anything approved whose slot has passed
  workflow_dispatch:
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests google-api-python-client google-auth
      - name: Publish due Shorts
        env:
          CRM_SUPABASE_KEY: ${{ secrets.CRM_SUPABASE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python engine/publish.py
